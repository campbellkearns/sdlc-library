# Week 6 Postgres: one database for the link shortener and the
# auth service. Host port 5433 avoids an old container on 5432.
services:
  postgres:
    image: postgres:17
    container_name: leap-w6-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: leap
      POSTGRES_PASSWORD: leap
      POSTGRES_DB: leap_w6
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leap -d leap_w6"]
      interval: 2s
      timeout: 3s
      retries: 15
